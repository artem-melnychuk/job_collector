# Djinni.co (Ukraine's largest IT job board) primary_keyword filter values.
# NOT the same vocabulary as the English "queries" above — Djinni's own
# category taxonomy, in English UI labels even though postings are in
# Ukrainian/Russian. Only add a value here after verifying it actually
# filters results at https://djinni.co/jobs/?primary_keyword=<value> — an
# unrecognized value silently falls back to Djinni's unfiltered "all jobs"
# feed instead of erroring (see collectors/djinni.py docstring).
djinni_categories:
  data:
    # "Data Analytics" was the original value here. Removed 2026-09-29:
    # Djinni stopped honoring it as a filter (djinni.co/jobs/?primary_keyword=
    # Data%20Analytics now reads "Jobs at Djinni", and the RSS feed returns
    # support/DevOps/marketing roles). The 29.09 collection pulled 13 such
    # off-profile postings under this query. collectors/djinni.py now drops
    # RSS items whose <category> does not match the keyword, so a future
    # silent fallback shows up as an error instead of noise.
    # Added 2026-09-08: both manually verified at
    # djinni.co/jobs/?primary_keyword=<value> to actually filter (page title
    # reads "Jobs <Category>", not the generic "Jobs at Djinni" fallback that
    # signals an unrecognized keyword), and both surfaced relevant results
    # (Business Analyst/Data Analyst roles, several at crypto/iGaming/fintech
    # companies). Tried and rejected: "Business Analytics" and "Product
    # Analytics" both silently fell back to the unfiltered all-jobs feed —
    # not valid Djinni category labels, despite reading naturally. "Data
    # Science" is valid but skewed toward ML/data-architecture roles (Data
    # Architect, Computer Vision Engineer) outside his profile — not added.
    - "Data Analyst"
    - "Business Analyst"

# Free-text Ukrainian-language search phrases for Work.ua and Robota.ua
# (both general, not IT-only, Ukrainian job boards — see collectors/work_ua.py
# and collectors/robota_ua.py docstrings for why they were added). NOT the
# same vocabulary as djinni_categories (Djinni uses English category labels
# as a categorical filter) or the shared English "queries" above (postings
# and search terms on these two sites are Ukrainian/Russian).
ukrainian_categories:
  data:
    - "аналітик даних"
    - "бізнес аналітик"
    - "продуктовий аналітик"
    - "фінансовий аналітик"
    - "аналітик"


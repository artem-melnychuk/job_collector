  # board (159 jobs total, most of them non-crypto DRW roles) — the existing
  # title-vs-query check in this collector already filters those out, same
  # as any other shared board.
  - company: "Cumberland (DRW)"
    ats: "greenhouse"
    slug: "drweng"

